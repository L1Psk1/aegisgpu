apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgpu-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisgpu-api
  template:
    metadata:
      labels:
        app: aegisgpu-api
    spec:
     containers:
        - name: aegisgpu-api
          image: aegisgpu-api:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: aegisgpu-config
            - secretRef:
                name: aegisgpu-secret

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
