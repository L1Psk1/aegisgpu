apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgpu-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisgpu-api
  template:
    metadata:
      labels:
        app: aegisgpu-api
    spec:
      serviceAccountName: aegisgpu-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: aegisgpu-api
          image: aegisgpu-api:v2
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: aegisgpu-config
            - secretRef:
                name: aegisgpu-secret

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
