apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegisgpu-allow-authorized
spec:
  podSelector:
    matchLabels:
      app: aegisgpu-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: allowed-client
      ports:
        - protocol: TCP
          port: 8000
